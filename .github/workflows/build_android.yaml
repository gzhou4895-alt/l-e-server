name: Build & Release 汉化版 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Android/**'

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./Android/src

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # 开启缓存，加快后续构建速度

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 解码签名文件
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV

      - name: 编译 Release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 增加 JVM 内存防止崩溃
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ env.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 找到 APK 文件
        if: github.event_name != 'pull_request'
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$(basename "$APK_PATH")" >> $GITHUB_ENV

      - name: 上传 APK 到 Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: Android/src/${{ env.APK_PATH }}

      - name: 创建 Release 并上传 APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "汉化版 - ${{ github.sha }}"
          tag_name: build-${{ github.run_number }}
          body: |
            ## 📱 Mobile Server 汉化版
            - **提交**: ${{ github.sha }}
            - **编译时间**: ${{ github.event.head_commit.timestamp }}
            ---
            *自动构建，请下载下方 APK 安装。*
          files: Android/src/${{ env.APK_PATH }}
          generate_release_notes: false
          overwrite: true
