name: Build & Release 汉化版 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Android/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Android/**'

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    # --- 关键修复：添加写入权限 ---
    permissions:
      contents: write
    # ---------------------------
    defaults:
      run:
        # 所有的步骤默认都在此目录下执行
        working-directory: ./Android/src

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 解码签名文件
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 将 keystore 生成在当前工作目录（Android/src）下
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          # 获取绝对路径，供下一步使用
          echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV

      - name: 编译 Release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 使用绝对路径引用的签名文件，避免 Gradle 模块路径偏移
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ env.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 找到 APK 文件
        if: github.event_name != 'pull_request'
        run: |
          # 寻找生成的 APK 并保存路径
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$(basename "$APK_PATH")" >> $GITHUB_ENV

      - name: 上传 APK 到 Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          # 此处的路径需包含相对于项目根目录的全路径
          path: Android/src/${{ env.APK_PATH }}

      - name: 创建 Release 并上传 APK
        # 仅在 push 到 main 分支时执行
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "汉化版 - ${{ github.sha }}"
          # 使用构建号作为标签名，例如 build-1, build-2
          tag_name: build-${{ github.run_number }}
          body: |
            ## 📱 Mobile Server 汉化版
            
            - **提交**: ${{ github.sha }}
            - **基于**: techjarves/mobile-server
            
            ### 下载说明
            下方 `${{ env.APK_NAME }}` 即为汉化版安装包。
            
            ---
            *由 GitHub Actions 自动构建*
          files: Android/src/${{ env.APK_PATH }}
          generate_release_notes: false
          # 如果标签已存在则覆盖（可选）
          overwrite: true
